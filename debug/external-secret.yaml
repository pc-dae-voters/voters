# The voters database's connection details, written to Vault at apps/<app name>/voters-db by bin/db-vault-secret.sh,
# from the voters-db Terraform object's outputs. The secret has the PG* environment variables psql uses, as files, and
# db-env.sh, which exports them
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: voters-db
  namespace: ${nameSpace}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: voters-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PGHOST: "{{ .PGHOST }}"
        PGPORT: "{{ .PGPORT }}"
        PGDATABASE: "{{ .PGDATABASE }}"
        PGUSER: "{{ .PGUSER }}"
        PGPASSWORD: "{{ .PGPASSWORD }}"
        # The password is single quoted, the generated passwords don't contain single quotes
        db-env.sh: |
          export PGHOST="{{ .PGHOST }}"
          export PGPORT="{{ .PGPORT }}"
          export PGDATABASE="{{ .PGDATABASE }}"
          export PGUSER="{{ .PGUSER }}"
          export PGPASSWORD='{{ .PGPASSWORD }}'
  dataFrom:
    - extract:
        key: apps/${appName}/voters-db
