# Debug pod for querying the voters database, the mac-k8s debug-pod image, which has psql. The database is in the
# voters VPC, which is peered with the EKS cluster's. Use it with:
#   kubectl exec -it -n voters deploy/voters-debug -- bash
#   source /etc/voters-db/db-env.sh && psql
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${appName}
  namespace: ${nameSpace}
  labels:
    app: ${appName}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${appName}
  template:
    metadata:
      labels:
        app: ${appName}
    spec:
      containers:
        - name: debug
          image: paulcarltondae/debug-pod:0.2.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # The only writable path, HOME is /tmp, e.g. for psql's history
            - name: tmp
              mountPath: /tmp
            - name: voters-db
              mountPath: /etc/voters-db
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: voters-db
          secret:
            secretName: voters-db
